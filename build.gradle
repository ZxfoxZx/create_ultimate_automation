
plugins {
    id 'eclipse'
    id 'net.neoforged.moddev.legacyforge' version '2.0.143'
}

version = '1.0'
base.archivesName = "modid"

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = "1.20.1-47.4.22"

    runs {
        client {
            client()

            def mcreatorJvmOptions = System.getenv('MCREATOR_JVM_OPTIONS')
            if (mcreatorJvmOptions) {
                mcreatorJvmOptions.split("\\s+").findAll { it.trim() }.each { arg ->
                    jvmArgument(arg)
                }
            }
        }
        server {
            server()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        mcreator {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

mixin {
    if (file("src/main/resources/create_ultimate_automation.mixins.json").exists()) {
        add sourceSets.main, "create_ultimate_automation.refmap.json"
        config "create_ultimate_automation.mixins.json"
    }
}

// Maven repositories
repositories {
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ithundxr.dev/mirror" }
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://maven.blamejared.com/" }
}

dependencies {
    // Create 6.0.8
    modImplementation("com.simibubi.create:create-1.20.1:6.0.8-289:slim") {
        transitive = false
    }

    // Ponder
    modImplementation("net.createmod.ponder:Ponder-Forge-1.20.1:1.0.91")

    // Flywheel
    modCompileOnly("dev.engine-room.flywheel:flywheel-forge-api-1.20.1:1.0.5")
    modRuntimeOnly("dev.engine-room.flywheel:flywheel-forge-1.20.1:1.0.5")

    // Registrate
    modImplementation("com.tterrag.registrate:Registrate:MC1.20-1.3.3")

    // Create: Configurable Machine Outputs
    modRuntimeOnly("maven.modrinth:pd8eLyMu:4kMqpiVM")

    // Create Repair
    modRuntimeOnly("maven.modrinth:G3K7UdxY:Cu8CVRG9")

    // Create Crafts & Additions
    modRuntimeOnly("maven.modrinth:kU1G12Nn:9LgyB6Yb")

    // Create: Crafts & (More) Additions
    modRuntimeOnly("maven.modrinth:ib8iIkX3:dXMiJShD")

    // Create: The Factory Must Grow
    modRuntimeOnly("maven.modrinth:USgVjXsk:ZNOx0jhg")

    // Just Enough Items (JEI)
    modRuntimeOnly("mezz.jei:jei-1.20.1-forge:15.74.0.227")

    // Existing MixinExtras and Mixin dependencies
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.5.0"))
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jar {
    if (file("src/main/resources/create_ultimate_automation.mixins.json").exists()) {
        manifest.attributes([
                "MixinConfigs": "create_ultimate_automation.mixins.json"
        ])
    }
}

apply from: 'mcreator.gradle'
